name: Bootstrap historical fishing-school references
on:
  push:
    branches: [feature/explorer-linked-records]
    paths:
      - .github/workflows/bootstrap-classic-schools.yml
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/explorer-linked-records
      - name: Generate CMaNGOS GPLv3 historic coordinates, validated against published spots
        run: |
          python3 scripts/import_classic_schools.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('database/reference/cmangos-school-spawns.json')
          d=json.loads(p.read_text())
          assert d['meta']['status']=='classic_reference_unverified'
          assert d['meta']['totalLocations']>100
          assert len(d['meta']['sourceSha256'])==64
          assert len(d['schools']['School of Deviate Fish'])>=5
          assert len(d['npcNames'])>0
          print('Verified historical references:',d['meta']['totalLocations'])
          PY
      - name: Commit attributed historical packs to the PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/reference/cmangos-school-spawns.json FishingAtlas/Data/ClassicSchoolLocations.lua FishingAtlas/Data/ClassicNPCNames.lua
          if ! git diff --cached --quiet; then
            git commit -m 'data: bundle attributed classic fishing school spawn references and creature names'
            git push origin HEAD:feature/explorer-linked-records
          fi
