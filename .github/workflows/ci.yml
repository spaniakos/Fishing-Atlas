name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 and LuaCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck
      - name: Validate generated database
        run: |
          python3 scripts/build_catalog.py --check
          python3 scripts/catalog_coverage.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/import_curated.py database/source-pack.example.json --check
      - name: Lua syntax validation
        run: |
          find FishingAtlas tests -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: Lua static analysis
        run: luacheck FishingAtlas tests --config .luacheckrc
      - name: Unit tests
        run: |
          lua5.1 tests/test_storage.lua
          lua5.1 tests/test_commands.lua
          lua5.1 tests/test_fishing.lua
          lua5.1 tests/test_nearby.lua
          lua5.1 tests/test_kitchen.lua
          lua5.1 tests/test_journal.lua
          lua5.1 tests/test_guides.lua
          lua5.1 tests/test_vendor.lua
          lua5.1 tests/test_catalog_runtime.lua
          lua5.1 tests/test_schools.lua
          lua5.1 tests/test_gears.lua
          lua5.1 tests/test_map_pins.lua
      - name: Validate manifest and documentation
        run: python3 scripts/validate.py
