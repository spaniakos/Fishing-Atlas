name: Seed v0.99.6 offline source pack
on:
  push:
    branches:
      - feature/explorer-linked-records
    paths:
      - .github/workflows/seed-offline-v0996.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download an independently verifiable Everloot snapshot
        env:
          EVERLOOT_API_KEY: ${{ secrets.EVERLOOT_API_KEY }}
        run: python3 scripts/seed_offline.py
      - name: Verify attributed pack and catalog
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/build_catalog.py --check
          python3 scripts/catalog_coverage.py
          test -s database/observed/everloot-normalized.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("database/observed/everloot-normalized.json").read_text())
          assert d["meta"]["sourceSha256"] != "not-imported"
          assert d["meta"]["dataAsOf"]
          assert sum(d["meta"]["recordCounts"].values()) > 0
          print("Offline Everloot snapshot verified:", d["meta"]["dataAsOf"])
          PY
      - name: Commit offline observed snapshot to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FishingAtlas/Data/EverlootObserved.lua database/observed/everloot-normalized.json database/observed/last-diff.json
          if git diff --cached --quiet; then
            echo "Upstream data has not changed."
          else
            git commit -m 'data: bundle attributed Everloot offline snapshot for v0.99.6'
            git push origin HEAD:feature/explorer-linked-records
          fi
