name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks zip
          sudo luarocks install luacheck
      - name: Validate and test
        run: |
          python3 scripts/build_catalog.py --check
          python3 scripts/catalog_coverage.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/import_curated.py database/source-pack.example.json --check
          find FishingAtlas tests -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          luacheck FishingAtlas tests --config .luacheckrc
          lua5.1 tests/test_storage.lua
          lua5.1 tests/test_commands.lua
          lua5.1 tests/test_fishing.lua
          lua5.1 tests/test_nearby.lua
          lua5.1 tests/test_kitchen.lua
          lua5.1 tests/test_journal.lua
          lua5.1 tests/test_guides.lua
          lua5.1 tests/test_vendor.lua
          lua5.1 tests/test_catalog_runtime.lua
          lua5.1 tests/test_schools.lua
          lua5.1 tests/test_gears.lua
          lua5.1 tests/test_map_pins.lua
          lua5.1 tests/test_catalog_planner.lua
          lua5.1 tests/test_browser.lua
          lua5.1 tests/test_diagnostics.lua
          lua5.1 tests/test_migration.lua
          lua5.1 tests/test_ui_features.lua
          lua5.1 tests/test_skill.lua
          lua5.1 tests/test_source_data.lua
          lua5.1 tests/test_issues.lua
          python3 scripts/validate.py
      - name: Package
        run: python3 scripts/package.py --tag "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: fishing-atlas-package
          path: dist/*
      - name: Publish GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
