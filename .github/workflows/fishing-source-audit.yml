name: Build fishing source-coverage audit
on:
  push:
    branches: [feature/explorer-linked-records]
    paths:
      - .github/workflows/fishing-source-audit.yml
      - scripts/audit_fishing_sources.py
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/explorer-linked-records
      - name: Audit every fishing source, including unknowns
        run: |
          python3 scripts/audit_fishing_sources.py --write
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("database/audit/fishing-source-coverage.json").read_text())
          assert result["meta"]["totalRecords"] == len(result["items"])
          assert len({r["id"] for r in result["items"]}) == len(result["items"])
          assert result["meta"]["counts"]["equipment"] == 11
          assert next(x for x in result["items"] if x["id"]==8959)["group"] == "associated_item"
          assert all("sourceStatus" in r and "evidence" in r for r in result["items"])
          print("Audit verified",result["meta"])
          PY
      - name: Commit complete reproducible coverage audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FISHING-SOURCE-AUDIT.md database/audit/fishing-source-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: add fully sourced fishing item/vendor/drop/acquisition coverage audit'
            git push origin HEAD:feature/explorer-linked-records
          fi
